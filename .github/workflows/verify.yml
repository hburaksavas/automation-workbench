name: TestTR verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  first-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testtr/**/pom.xml
      - name: Verify first-test guide
        shell: pwsh
        run: ./.github/scripts/verify-first-test.ps1
      - name: Verify AI draft workflow without API calls
        shell: pwsh
        run: ./.github/scripts/verify-ai-drafts.ps1
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/testtr
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        profile: [selenide, selenium, playwright]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testtr/**/pom.xml
      - name: Verify on Ubuntu
        if: runner.os == 'Linux'
        run: sh ./mvnw --batch-mode clean verify -P${{ matrix.profile }} -Dtesttr.redactDiagnostics=true "-Dtesttr.codeRevision=$GITHUB_SHA"
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode clean verify -P${{ matrix.profile }} "-Dtesttr.redactDiagnostics=true" "-Dtesttr.codeRevision=$env:GITHUB_SHA"
      - name: Export TestTR reports
        if: success() || failure()
        shell: pwsh
        run: ../../.github/scripts/export-testtr-reports.ps1
      - name: Upload TestTR reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: testtr-${{ matrix.os }}-${{ matrix.profile }}
          path: projects/testtr/target/ci-testtr-reports/TEST-*.xml
          if-no-files-found: ignore
