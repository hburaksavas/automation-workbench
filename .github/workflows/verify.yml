name: TestTR verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  mcp-server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: projects/testtr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testtr/**/pom.xml
      - name: Install TestTR Maven goals
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd --batch-mode -pl maven-plugin,runner-support -am install }
          else { sh ./mvnw --batch-mode -pl maven-plugin,runner-support -am install }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MCP and owned Maven process lifecycle
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd --batch-mode -pl mcp-server -am -Pmcp-acceptance verify }
          else { sh ./mvnw --batch-mode -pl mcp-server -am -Pmcp-acceptance verify }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/testtr-vscode/package-lock.json
      - name: Build Discovery for the editor client acceptance test
        working-directory: projects/testtr-discovery
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd --batch-mode -DskipTests package }
          else { sh ./mvnw --batch-mode -DskipTests package }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp target/testtr-discovery-0.1.0-SNAPSHOT.jar com.microsoft.playwright.CLI install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify editor commands and both real MCP servers
        working-directory: projects/testtr-vscode
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mavenConfig = Get-ChildItem (Join-Path $HOME '.m2/wrapper/dists') -Filter m2.conf -Recurse | Select-Object -First 1
          if (!$mavenConfig) { throw 'Maven Wrapper installation not found' }
          $env:TESTTR_MAVEN_HOME = $mavenConfig.Directory.Parent.FullName
          $env:TESTTR_REAL_MCP = '1'
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  discovery:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: projects/testtr-discovery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testtr-discovery/pom.xml
      - name: Build discovery
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd --batch-mode -DskipTests package }
          else { sh ./mvnw --batch-mode -DskipTests package }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install discovery browser
        run: java -cp target/testtr-discovery-0.1.0-SNAPSHOT.jar com.microsoft.playwright.CLI install --with-deps chromium
      - name: Verify discovery
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd --batch-mode verify }
          else { sh ./mvnw --batch-mode verify }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  first-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testtr/**/pom.xml
      - name: Verify first-test guide
        shell: pwsh
        run: ./.github/scripts/verify-first-test.ps1
      - name: Verify AI draft workflow without API calls
        shell: pwsh
        run: ./.github/scripts/verify-ai-drafts.ps1
      - name: Verify impacted scenario execution
        shell: pwsh
        run: ./.github/scripts/verify-impact-selection.ps1
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/testtr
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        profile: [selenide, selenium, playwright]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testtr/**/pom.xml
      - name: Verify on Ubuntu
        if: runner.os == 'Linux'
        run: sh ./mvnw --batch-mode clean verify -P${{ matrix.profile }} -Dtesttr.redactDiagnostics=true "-Dtesttr.codeRevision=$GITHUB_SHA"
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode clean verify -P${{ matrix.profile }} "-Dtesttr.redactDiagnostics=true" "-Dtesttr.codeRevision=$env:GITHUB_SHA"
      - name: Export TestTR reports
        if: success() || failure()
        shell: pwsh
        run: ../../.github/scripts/export-testtr-reports.ps1
      - name: Upload TestTR reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: testtr-${{ matrix.os }}-${{ matrix.profile }}
          path: projects/testtr/target/ci-testtr-reports/TEST-*.xml
          if-no-files-found: ignore
